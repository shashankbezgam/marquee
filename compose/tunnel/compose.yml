     authelia:
        image: authelia/authelia:latest
        container_name: authelia
        hostname: authelia
        restart: unless-stopped
        env_file:
            - .env
        environment:
            - TZ=Asia/Kolkata
        ports:
            - 9091:9091
        networks:
            - backend_net
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /docker/appdata/authelia:/config
            - /docker/compose/tunnel/configuration.yml:/config/configuration.yml:ro

networks:
    backend_net:
        external: true