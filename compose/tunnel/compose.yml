     tsrouterh52:
        image: tailscale/tailscale:latest
        container_name: tsrouterh52
        hostname: tsrouterh52
        volumes:
            - /docker/appdata/tailscale/state:/var/lib/tailscale
            - /lib/modules:/lib/modules:ro
        devices:
            - /dev/net/tun:/dev/net/tun
        environment:
            - TS_AUTHKEY=${TS_AUTHKEY}
            - TS_STATE_DIR=/var/lib/tailscale
            - TS_AUTH_ONCE=true
            - TS_USERSPACE=false
        cap_add:
            - NET_ADMIN
            - NET_RAW
        networks:
            - edge_net
        restart: unless-stopped

     nginx-proxy:
        image: nginx:alpine
        container_name: nginx-proxy
        network_mode: "service:tsrouterh52" # Merges with the Tailscale network container
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - tsrouterh52
        restart: unless-stopped

networks:
    edge_net:
        external: true
