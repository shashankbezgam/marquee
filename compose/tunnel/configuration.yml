theme: 'auto'

server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: 'info'

# Secrets come from .env via env_file in compose. Do NOT put them here.
# Authelia binds them by name:
#   AUTHELIA_SESSION_SECRET
#   AUTHELIA_STORAGE_ENCRYPTION_KEY
#   AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
#   AUTHELIA_NOTIFIER_SMTP_USERNAME / _PASSWORD / _SENDER

authentication_backend:
  file:
    path: '/config/users_database.yml'

session:
  cookies:
    - name: 'authelia_session'
      domain: 'home52lab.duckdns.org'
      authelia_url: 'https://auth.home52lab.duckdns.org'
      default_redirection_url: 'https://seerr.home52lab.duckdns.org' # Will be changed to Homepage dashboard
      expiration: '2 hour'
      inactivity: '10 minutes'
      remember_me: '1 month'

storage:
  local:
    path: '/config/db.sqlite3'

notifier:
  disable_startup_check: false
  smtp:
    address: 'submission://smtp.gmail.com:587'

access_control:
  default_policy: 'deny'
  rules:
    # - domain:
    #     - '.home52lab.duckdns.org'
    #   policy: 'bypass'
    - domain:
        # - 'homepage.home52lab.duckdns.org'
        - 'qui.home52lab.duckdns.org'
      policy: 'two_factor'

identity_providers:
  oidc:
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/config/keys/private.pem" | mindent 10 "|" | msquote }}
    clients:
      - client_id: 'qui'
        client_name: 'qui'
        client_secret: '{{ env "QUI_OIDC_CLIENT_SECRET_DIGEST" }}'
        public: false
        authorization_policy: 'two_factor'
        consent_mode: 'implicit'
        redirect_uris:
          - 'https://qui.home52lab.duckdns.org/api/auth/oidc/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'