events { worker_connections 1024; }

http {
    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0;
    server_tokens off;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 86400s;

    # TLS defined once, inherited by every ssl server below
    ssl_certificate     /etc/nginx/ssl/duckdns.crt;
    ssl_certificate_key /etc/nginx/ssl/duckdns.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    upstream plex_backend { server 192.168.0.24:32400; keepalive 32; }

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name *.home52lab.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # ════════ OPEN: AUTHELIA PORTAL ════════
    server {
        listen 443 ssl;
        http2 on;
        server_name auth.home52lab.duckdns.org;
        location / {
            proxy_pass http://192.168.0.24:9091;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ════════ OPEN: PLEX WEB (OPTIONAL) ════════
    # Native apps use direct 45000 and skip this. Delete this block if you only
    # want native access; Plex still works fully over 45000.
    server {
        listen 443 ssl;
        http2 on;
        server_name plex.home52lab.duckdns.org;
        location = / { return 301 /web; }
        location / {
            proxy_pass http://plex_backend;
            proxy_http_version 1.1;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    # ════════ OPEN: SEERR (friends request media; own Plex login) ════════
    server {
        listen 443 ssl;
        http2 on;
        server_name seerr.home52lab.duckdns.org;
        location / {
            proxy_pass http://192.168.0.24:5055;
            proxy_http_version 1.1;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
    }

    # ════════ GATED: TAUTULLI (8181) ════════
    server {
        listen 443 ssl;
        http2 on;
        server_name tautulli.home52lab.duckdns.org;
        location /internal/authelia/authz {
            internal;
            proxy_pass http://192.168.0.24:9091/api/authz/auth-request;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location / {
            auth_request /internal/authelia/authz;
            auth_request_set $redirection_url $upstream_http_location;
            error_page 401 =302 $redirection_url;
            proxy_pass http://192.168.0.24:8181;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
    }

    # ════════ GATED: QUI / qBittorrent UI (7476) ════════
    server {
        listen 443 ssl;
        http2 on;
        server_name qui.home52lab.duckdns.org;
        location /internal/authelia/authz {
            internal;
            proxy_pass http://192.168.0.24:9091/api/authz/auth-request;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location / {
            auth_request /internal/authelia/authz;
            auth_request_set $redirection_url $upstream_http_location;
            error_page 401 =302 $redirection_url;
            proxy_pass http://192.168.0.24:7476;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
    }
}