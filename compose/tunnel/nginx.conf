events {
    worker_connections 1024;
}

http {
    # ── WebSocket connection header map ──────────────────────────────────────
    # DO NOT hardcode Connection "upgrade" globally — that breaks HTTP
    # keep-alive on every non-WebSocket request. This map sends the correct
    # value conditionally: "upgrade" during a WS handshake, "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       "";     # Empty clears the header — required for upstream keepalive to work.
    }                    # "close" here would kill the connection pool on every plain HTTP request.

    # ── Global tunables ───────────────────────────────────────────────────────
    sendfile              on;
    keepalive_timeout     65;
    client_max_body_size  0;         # No upload cap — needed for subtitle imports etc.
    server_tokens         off;       # Don't advertise nginx version in response headers

    proxy_connect_timeout  30s;
    proxy_send_timeout     30s;
    proxy_read_timeout     86400s;   # 24 h — prevents long Plex streams from dropping mid-film

    # Docker's embedded DNS — re-resolves container names every 30 s so Nginx
    # picks up the new IP if a container restarts rather than hitting stale cache
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Plex upstream with connection pooling ─────────────────────────────────
    # Keeps 32 TCP connections warm to Plex instead of opening a fresh one per
    # request — meaningfully reduces overhead during heavy segment fetching
    upstream plex_backend {
        server plex:32400;
        keepalive 32;
    }


    # ═══════════════════════════════════════════════════════════════════════════
    # PLEX MEDIA SERVER
    # Tailscale: http://<tailscale-ip>:32400/web
    # ═══════════════════════════════════════════════════════════════════════════
    server {
        listen      32400;
        server_name _;

        location / {
            proxy_pass         http://plex_backend;
            proxy_http_version 1.1;   # Required for WS and keep-alive
            proxy_redirect     off;   # Prevent Nginx mangling Plex's Location headers



            # Non-Standard forwarding headers
            # ── Why we hardcode 10.54.0.1 instead of using $remote_addr ──────────
            # Tailscale assigns devices IPs in the CGNAT range (100.64.0.0/10).
            # Plex only recognises RFC 1918 private ranges (10.x, 172.16.x, 192.168.x)
            # as "local network" — it silently ignores anything outside that space in
            # its allowed-networks whitelist, even if you explicitly add 100.64.0.0/10.
            #
            # The side-effect: Plex demands full authentication from Tailscale clients,
            # which the iOS Plex app cannot complete correctly, so it fails to connect
            # even though the Tailscale tunnel itself is working fine.
            #
            # Fix (ref: https://www.jjpdev.com/posts/plex-media-server-tailscale/):
            # We replace X-Real-IP and X-Forwarded-For with a hardcoded RFC 1918 address
            # (10.54.0.1) before the request reaches Plex. Plex reads these headers to
            # determine the client's source IP — it never sees the real 100.x address.
            # Plex then considers the request "local", skips auth, and the iOS app works.
            #
            # 10.54.0.1 was chosen because it doesn't conflict with the LAN (192.168.0.0/24)
            # or any Docker bridge network. The matching entry in Plex under:
            # Settings → Network → "List of IPs allowed without auth" is 10.54.0.0/24.
            #
            # DO NOT switch these back to $remote_addr / $proxy_add_x_forwarded_for —
            # that would expose the real Tailscale CGNAT IP and break iOS auth again.
            proxy_set_header Host              $http_host;
            # proxy_set_header X-Real-IP         $remote_addr;          # (default: sends actual remote client IP)
            # proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for; # (default: appends client IP to existing X-Forwarded-For)
            proxy_set_header X-Real-IP         "10.54.0.1";            # force Plex to see a RFC1918 'local' IP, so it skips auth for Tailscale clients
            proxy_set_header X-Forwarded-For   "10.54.0.1";            # also spoof X-Forwarded-For for the same reason
       
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Referer            ""; # Strip Referer — it leaks the Tailscale hostname to Plex, meaning to prevent Plex from logging the Tailscale hostname in its logs, which is a security risk.

            # ── Optional: Origin + Host spoofing + Location rewrite ──────────────
            # These are the nginx equivalents of the Caddy header_up/header_down
            # directives from the reference article. They are NOT needed for the
            # iOS auth fix above — X-Real-IP/X-Forwarded-For handle that.
            #
            # Enable these if you experience either of:
            #   a) Browser-based Plex Web (web UI) breaking after the fix above —
            #      the Origin header carries the Tailscale hostname/IP and some Plex
            #      responses include it in CORS checks or redirect Location headers.
            #   b) Plex redirect loops — when Plex issues a 301/302 with a Location
            #      header containing 10.54.0.1, the client can't follow it because
            #      that IP isn't reachable directly. The sub_filter rewrites it back
            #      to your actual Tailscale IP so the client lands correctly.
            #
            # To enable: uncomment the three blocks below AND add to the server block:
            #   proxy_redirect http://10.54.0.1/ http://100.118.57.37/;
            #
            # proxy_set_header Origin "10.54.0.1"; # un-hide the Tailscale hostname in the Origin header
            # proxy_set_header Host   "10.54.0.1"; # un-hide the Tailscale hostname in the Host header
            #
            # # Rewrite Location response headers back to the real Tailscale IP
            # # so redirects issued by Plex resolve correctly on the client side.
            # proxy_hide_header Location;
            # add_header Location $upstream_http_location;   # un-hide after sub_filter rewrites it
            # ── End optional block ────────────────────────────────────────────────

            # Clear hop-by-hop Connection header so the keepalive 32 pool works —
            # without this the upstream block's keepalive directive has no effect
            proxy_set_header Connection $connection_upgrade;

            # WebSocket — Plex Web relies on WS for playback state sync
            proxy_set_header Upgrade    $http_upgrade;

            # Critical for scrubbing: bypass Nginx's buffer so bytes flow
            # directly to the client instead of accumulating server-side first
            proxy_buffering         off;
            proxy_request_buffering off;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # TAUTULLI — Plex monitoring & analytics
    # Tailscale: http://<tailscale-ip>:8181
    # ═══════════════════════════════════════════════════════════════════════════
    server {
        listen      8181;
        server_name _;

        location / {
            proxy_pass         http://tautulli:8181;
            proxy_http_version 1.1;
            proxy_redirect     off;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # SEERR
    # Tailscale: http://<tailscale-ip>:5055
    # ═══════════════════════════════════════════════════════════════════════════
    server {
        listen      5055;
        server_name _;

        location / {
            proxy_pass         http://seerr:5055;
            proxy_http_version 1.1;
            proxy_redirect     off;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # seerr uses socket.io (WebSocket) for real-time request
            # and approval notifications in the UI
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # QUI — qBittorrent alternative web UI
    # Tailscale: http://<tailscale-ip>:7476
    # ═══════════════════════════════════════════════════════════════════════════
	server {
	    listen      7476;
	    server_name _;

	    location / {
	        proxy_pass         http://qui:7476;
	        proxy_http_version 1.1;
	        proxy_redirect     off;

	        proxy_set_header Host              $http_host;
	        proxy_set_header X-Real-IP         $remote_addr;
	        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	        proxy_set_header X-Forwarded-Proto $scheme;

	        proxy_set_header Upgrade    $http_upgrade;
	        proxy_set_header Connection $connection_upgrade;

	        proxy_buffering off;
	    }
	}

}
