services:
    docker-socket-proxy:
        image: tecnativa/docker-socket-proxy:latest
        container_name: docker-socket-proxy
        labels:
            - wud.watch=true
            - wud.watch.digest=true
            - wud.trigger.exclude=dockercompose.auto
        restart: unless-stopped
        # ports:
        # # Bind to internal LAN/VPC IP or firewall port 2375 to allow only Central WUD
        # - "2375:2375"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        environment:
            # Enable read-only access for container and image discovery
            - CONTAINERS=1
            - IMAGES=1
            - INFO=1
            - VERSION=1
            - EVENTS=1
            - PING=1
            - POST=1
            - NETWORKS=1
            - VOLUMES=1
            # Explicitly deny all mutating operations
            - DELETE=0
            - BUILD=0
            - COMMIT=0
            - EXEC=0
            - SECRETS=0
            - SWARM=0
            - SYSTEM=0
        networks:
            - socket_net

    wud:
        image: getwud/wud:latest
        container_name: wud
        restart: unless-stopped
        ports:
            - "3000:3000"
        env_file:
            - .env
        environment:
            - TZ=Asia/Kolkata
        labels:
            - wud.watch=true
            - wud.watch.digest=true 
            - wud.trigger.exclude=dockercompose.auto
        volumes:
            - /docker/compose:/docker/compose
        networks:
            - backend_net
            - socket_net
        depends_on:
            - docker-socket-proxy

    # Create directories that store your stacks and store Dockge's stack
    # > mkdir -p /opt/stacks /opt/dockge
    # > cd /opt/dockge
    # > docker compose up -d
    dockge:
        image: louislam/dockge:latest
        container_name: dockge
        hostname: dockge
        restart: unless-stopped
        labels:
            - wud.watch=true
            - wud.watch.digest=true
            - wud.trigger.include=dockercompose.auto
        ports:
            - 5001:5001
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /var/run/docker.sock:/var/run/docker.sock
            - ./data:/app/data
            # Stacks Directory
            # ⚠️ READ IT CAREFULLY. If you did it wrong, your data could end up writing into a WRONG PATH.
            # ⚠️ 1. FULL path only. No relative path (MUST)
            # ⚠️ 2. Left Stacks Path === Right Stacks Path (MUST)
            - /opt/stacks:/opt/stacks
        environment:
            - TZ=Asia/Kolkata
            # Tell Dockge where to find the stacks
            - DOCKGE_STACKS_DIR=/opt/stacks
        networks:
            - backend_net

    uptime-kuma:
        image: louislam/uptime-kuma:latest
        container_name: uptime-kuma
        hostname: uptime-kuma
        restart: unless-stopped
        labels:
            - wud.watch=true
            - wud.watch.digest=true
            - wud.trigger.include=dockercompose.auto
        ports:
            - 3001:3001 # This maps the container port "3001" to the host port "3001"
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /docker/appdata/uptime-kuma:/app/data # Configuring persistent storage
        environment:
            - TZ=Asia/Kolkata # Set the timezone (change to your preferred local timezone so monitoring times are the same)
            - UMASK=0022 # Set your file permissions manually
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3001"]
            interval: 30s
            retries: 3
            start_period: 10s
            timeout: 5s
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        networks:
            - backend_net

    portainer:
        image: portainer/portainer-ce:lts
        container_name: portainer
        hostname: portainer
        labels:
            - wud.watch=true
            - wud.watch.digest=true
            - wud.trigger.include=dockercompose.auto
        restart: unless-stopped
        ports:
            - 8000:8000
            - 9443:9443
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data
        networks:
            - backend_net

volumes:
    portainer_data:
        driver: local

networks:
    backend_net:
        external: true
    socket_net:
        internal: true