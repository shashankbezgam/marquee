services:
  nginx:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: unless-stopped
    labels:
      - wud.watch=true
      - wud.watch.digest=true
      - wud.trigger.include=dockercompose.auto
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /docker/compose/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
      - /var/log/nginx:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro

  docker-socket-proxy:
      image: tecnativa/docker-socket-proxy:latest
      container_name: docker-socket-proxy
      labels:
          - wud.watch=true
          - wud.watch.digest=true
          - wud.trigger.exclude=dockercompose.auto
      restart: unless-stopped
      # ports:
      # # Bind to internal LAN/VPC IP or firewall port 2375 to allow only Central WUD
      # - "2375:2375"
      volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
      environment:
          # Enable read-only access for container and image discovery
          - CONTAINERS=1
          - IMAGES=1
          - INFO=1
          - VERSION=1
          - EVENTS=1
          - PING=1
          - POST=1
          - NETWORKS=1
          - VOLUMES=1
          # Explicitly deny all mutating operations
          - DELETE=0
          - BUILD=0
          - COMMIT=0
          - EXEC=0
          - SECRETS=0
          - SWARM=0
          - SYSTEM=0
      networks:
          - d_socket_net

  wud:
      image: getwud/wud:latest
      container_name: wud
      restart: unless-stopped
      ports:
          - "3000:3000"
      env_file:
          - .env
      environment:
          - TZ=Asia/Kolkata
      labels:
          - wud.watch=true
          - wud.watch.digest=true 
          - wud.trigger.exclude=dockercompose.auto
      volumes:
          - /docker/compose:/docker/compose
      networks:
          - d_socket_net
          - wud_net
      depends_on:
          - docker-socket-proxy

networks:
  d_socket_net:
    internal: true
  wud_net:
