services:
    tailscale:
        image: tailscale/tailscale:latest
        container_name: tailscale-proxy
        network_mode: host
        volumes:
            - /docker/appdata/tailscale/state:/var/lib/tailscale
            - /lib/modules:/lib/modules:ro
        devices:
            - /dev/net/tun:/dev/net/tun
        labels:
            - wud.watch=true
            - wud.watch.digest=true
            - wud.trigger.include=dockercompose.auto
        environment:
            - TS_AUTHKEY=${TS_AUTHKEY}
            - TS_STATE_DIR=/var/lib/tailscale
            - TS_AUTH_ONCE=true
            - TS_USERSPACE=false
            - TS_ROUTES=192.168.0.0/24
        cap_add:
            - NET_ADMIN
            - NET_RAW
        restart: unless-stopped
